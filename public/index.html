<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tienda - Pago a domicilio</title>
<style>
body{font-family: Arial,Helvetica,sans-serif;max-width:980px;margin:20px auto;padding:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{border:1px solid #ddd;padding:10px;border-radius:8px}
img{max-width:100%;height:160px;object-fit:cover;border-radius:6px}
input,button{padding:8px;margin:4px}
</style>
</head>
<body>
<h1>Tienda - Pago a domicilio</h1>


<section>
<h2>Productos</h2>
<div id="products" class="grid"></div>
</section>


<section style="margin-top:18px">
<h2>Carrito</h2>
<div id="cart"></div>
<div style="margin-top:8px">
<input id="customerName" placeholder="Tu nombre" />
<input id="customerPhone" placeholder="Tu teléfono" />
<button id="placeOrder">Hacer pedido (pago a domicilio)</button>
</div>
<div id="orderMsg" style="margin-top:8px;color:green"></div>
</section>


<hr />
<p>¿Eres administrador? <a href="/admin.html">Accede al panel</a></p>


<script src="app.js"></script>
</body>
</html>
