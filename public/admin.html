<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Alsara Villanueva</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f3f3; margin: 0; padding: 0; }
    header { background: #2b7a0b; color: white; padding: 1rem; text-align: center; }
    main { max-width: 800px; margin: 2rem auto; background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h2 { color: #2b7a0b; }
    form { display: flex; flex-direction: column; gap: 1rem; }
    input, button { padding: 0.5rem; font-size: 1rem; }
    button { background: #2b7a0b; color: white; border: none; cursor: pointer; border-radius: 5px; transition: 0.3s; }
    button:hover { background: #236408; }
    .productos { margin-top: 2rem; }
    .producto { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem; border-bottom: 1px solid #ddd; }
    .producto img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
    .producto button { background: #c0392b; border: none; color: white; padding: 0.3rem 0.7rem; border-radius: 5px; cursor: pointer; }
    .producto button:hover { background: #a93226; }
  </style>
</head>
<body>
  <header>
    <h1>🛒 Panel de Administración</h1>
    <p>Alsara Villanueva de la Concepción</p>
  </header>

  <main>
    <h2>Agregar producto</h2>
    <form id="formProducto">
      <input type="text" id="nombre" placeholder="Nombre del producto" required>
      <input type="number" step="0.01" id="precio" placeholder="Precio (€)" required>
      <input type="text" id="imagen" placeholder="URL de la imagen" required>
      <button type="submit">Agregar producto</button>
    </form>

    <div class="productos">
      <h2>Productos actuales</h2>
      <div id="listaProductos"></div>
    </div>
  </main>

  <script>
    const form = document.getElementById('formProducto');
    const lista = document.getElementById('listaProductos');

    async function cargarProductos() {
      const res = await fetch('/api/productos');
      const productos = await res.json();
      lista.innerHTML = '';
      productos.forEach(p => {
        const div = document.createElement('div');
        div.className = 'producto';
        div.innerHTML = `
          <div>
            <img src="${p.imagen}" alt="${p.nombre}">
            <strong>${p.nombre}</strong> - ${p.precio.toFixed(2)}€
          </div>
          <button onclick="eliminarProducto('${p.id}')">Eliminar</button>
        `;
        lista.appendChild(div);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value.trim();
      const precio = parseFloat(document.getElementById('precio').value);
      const imagen = document.getElementById('imagen').value.trim();

      if (!nombre || !imagen || isNaN(precio)) {
        alert('❌ Completa todos los campos correctamente');
        return;
      }

      const res = await fetch('/api/add-product', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, precio, imagen })
      });

      const data = await res.json();
      if (data.ok) {
        alert('✅ Producto agregado');
        form.reset();
        cargarProductos();
      } else {
        alert('❌ Error al agregar producto');
      }
    });

    async function eliminarProducto(id) {
      if (!confirm('¿Seguro que quieres eliminar este producto?')) return;
      const res = await fetch(`/api/delete-product/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.ok) {
        alert('🗑️ Producto eliminado');
        cargarProductos();
      } else {
        alert('❌ Error al eliminar producto');
      }
    }

    cargarProductos();
  </script>
</body>
</html>
